<html>
    <head>
        <title>sphere</title>
        <style>
            body { margin: 0; }

            canvas {
                width: 100%;
                height: 100%
            }

            i {
                border: solid white;
                border-width: 0 .2em .2em 0;
                display: inline-block;
                padding: 1em;
            }

            #nav-left {
                position: absolute;
                right: 98%;
                top: 50%;
                transform: translateY( -50% );
            }

            #nav-right {
                position: absolute;
                left: 98%;
                top: 50%;
                transform: translateY( -50% );
            }

            .left {
                transform: rotate( 135deg );
                -webkit-transform: rotate( 135deg );
            }

            .right {
                transform: rotate( -45deg );
                -webkit-transform: rotate( -45deg );
            }

            @media only screen and (max-width: 1281px){
                #nav-left {
                    right: 94%;
                }
                
                #nav-right {
                    left: 94%;
                }
            }
        </style>
    </head>
    <body>
        <!--<a id="nav-left" href="01-02.html" alt="previous"><i class="arrow left"></i></a>-->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script>
            var scene = new THREE.Scene();
            var camera = new THREE.PerspectiveCamera( 75, window.innerWidth/window.innerHeight, 0.1, 1000 );

            scene.background = new THREE.Color(0x4b00ff);

            var renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth,window.innerHeight);
            document.body.appendChild(renderer.domElement);

            var geometry = new THREE.SphereGeometry(2,50,50);
            var material = new THREE.MeshBasicMaterial({color: 0xfdfaf0, wireframe: true});
            var cube = new THREE.Mesh(geometry,material);
            scene.add(cube);

            camera.position.z = 2;

            var animate = function(){
                requestAnimationFrame(animate);

                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                cube.rotation.z += 0.03;

                renderer.render(scene,camera);
            }

            animate();
        </script>
    </body>
</html>
